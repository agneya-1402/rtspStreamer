logLevel: info
rtsp: yes
rtspTransports: [tcp]
rtspEncryption: "no"
rtspAddress: :554

rtspAuthMethods: [digest]
authMethod: internal
authInternalUsers:
  - user: admin
    pass: "admin@123"
    permissions:
      - action: publish
      - action: read

paths:
  # Matches every path the simulator publishes to (Hikvision, Dahua,
  # CP Plus, Uniview, and generic path schemes all fall through to this).
  "~^.*$":
    source: publisher