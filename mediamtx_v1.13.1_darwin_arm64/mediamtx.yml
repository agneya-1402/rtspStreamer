logLevel: info
rtsp: yes
rtspTransports: [tcp]            # replaces 'protocols'
rtspEncryption: "no"             # replaces 'encryption'
# Use RTSP 8554 (standard unprivileged port, change if needed)
rtspAddress: :8554

rtspAuthMethods: [digest]        # replaces 'authMethods'
authMethod: internal
authInternalUsers:
  - user: admin
    pass: "admin@123"
    permissions:
      - action: publish
      - action: read

paths:
  "Streaming/Channels/101": 
    source: publisher
  "~^.*$":
    source: publisher
